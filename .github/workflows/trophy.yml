name: Update trophy
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  trophy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate trophy card
        uses: soulteary/github-profile-trophy-action@v1.1.0
        with:
          options: "username=Soura1345&theme=gruvbox&column=7&margin-w=15&margin-h=15"
          path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit trophy card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/trophy.svg
          git commit -m "Update trophy" || exit 0
          git push
